server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single page application: every unknown path opens the app.
  location / {
    try_files $uri /index.html;
  }

  # Hashed build files can be cached for a long time; index.html never.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
